<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚡ Gensyn Node Dashboard</title>
  <style>
    :root { --bg:#0b1324; --card:#111b33; --muted:#8fa4c9; --ok:#00ffae; --err:#ff5a5a; }
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,Arial}
    h1{font-size:2rem;text-align:center;margin:16px 8px}
    .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:16px 0}
    .stat{background:var(--card);padding:18px 24px;border-radius:14px;min-width:240px;text-align:center}
    .label{font-size:.95rem;color:var(--muted);margin-bottom:6px}
    .value{font-size:1.6rem;font-weight:700;color:var(--ok)}
    h2{width:100%;text-align:center;margin:24px 0 8px}
    table{width:92%;max-width:1100px;margin:0 auto;border-collapse:collapse;border-radius:12px;overflow:hidden}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #1b2a4a}
    th{background:#15233d;color:#d9e6ff}
    tr:nth-child(even){background:#0f1a30}
    .status.online{color:var(--ok)} .status.offline{color:var(--err)}
    .center{display:flex;justify-content:center;align-items:center}
    .peer-search{margin:26px 0}
    .peer-search input{padding:10px 12px;width:420px;max-width:75vw;border:none;border-radius:8px}
    .peer-search button{margin-left:8px;padding:10px 18px;border:none;border-radius:8px;background:var(--ok);color:#001b12;font-weight:700;cursor:pointer}
    .muted{color:var(--muted)} footer{margin:32px 0;text-align:center}
    a{color:var(--ok);text-decoration:none}
  </style>
</head>
<body>
  <h1>⚡ Gensyn Node Dashboard</h1>

  <div class="stats">
    <div class="stat">
      <div class="label">Avg Block Time</div>
      <div id="avgBlockTime" class="value">--</div>
    </div>
    <div class="stat">
      <div class="label">Completed Transactions</div>
      <div id="completedTx" class="value">--</div>
    </div>
    <div class="stat">
      <div class="label">Nodes Connected</div>
      <div id="nodesConnected" class="value">--</div>
    </div>
  </div>

  <h2>🏆 Leaderboard (Top 10)</h2>
  <table>
    <thead>
      <tr>
        <th style="width:60px">#</th>
        <th>Peer</th>
        <th style="width:160px">Score</th>
        <th style="width:160px">Reward</th>
        <th style="width:120px">Status</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
      <tr><td class="center" colspan="5" id="lbStatus">Loading…</td></tr>
    </tbody>
  </table>

  <div class="peer-search center">
    <div>
      <h3 class="center">🔎 Node Analytics (by Peer ID)</h3>
      <div class="center">
        <input id="peerIdInput" placeholder="Enter Peer ID (e.g., Qm...)" />
        <button id="lookupBtn">Lookup</button>
      </div>
      <p id="peerResult" class="center muted"></p>
    </div>
  </div>

  <footer class="muted">
    Auto-updates every 30s • Data from public Gensyn endpoints<br/>
    Made with ❤️ by @TheUvKhan
  </footer>

  <script>
    // Public API endpoints you shared
    const API = {
      nodesConnected: 'https://dashboard.gensyn.ai/api/v1/nodes-connected',
      networkStats:   'https://dashboard.gensyn.ai/api/v1/network-stats',
      leaderboard:    'https://dashboard.gensyn.ai/api/v1/leaderboard'
    };

    function fmt(x){ return (x ?? '--').toLocaleString ? x.toLocaleString() : x; }

    async function getJSON(url){
      const r = await fetch(url, { cache: 'no-store' });
      if(!r.ok) throw new Error(url + ' -> ' + r.status);
      return r.json();
    }

    async function loadStats(){
      try{
        const [nodes, stats] = await Promise.all([
          getJSON(API.nodesConnected),
          getJSON(API.networkStats)
        ]);

        // Try common key names defensively
        const avgBlockTime =
          stats.avg_block_time ?? stats.avgBlockTime ?? stats.block_time ?? null;

        const completedTx =
          stats.completed_transactions ?? stats.completedTransactions ?? stats.completed_tx ?? null;

        const nodesCount =
          nodes.nodes_connected ?? nodes.nodesConnected ?? nodes.count ?? nodes ?? null;

        document.getElementById('avgBlockTime').textContent = avgBlockTime ? `${avgBlockTime}s` : '--';
        document.getElementById('completedTx').textContent = fmt(completedTx);
        document.getElementById('nodesConnected').textContent = fmt(nodesCount);
      }catch(e){
        console.error(e);
        document.getElementById('avgBlockTime').textContent = '--';
        document.getElementById('completedTx').textContent = '--';
        document.getElementById('nodesConnected').textContent = '--';
      }
    }

    async function loadLeaderboard(){
      const tbody = document.getElementById('leaderboardBody');
      try{
        const data = await getJSON(API.leaderboard);
        const list = Array.isArray(data) ? data : (data.leaderboard || []);
        tbody.innerHTML = '';
        list.slice(0,10).forEach((row,i)=>{
          const peer   = row.peer ?? row.name ?? row.node ?? '—';
          const score  = row.score ?? '—';
          const reward = row.reward ?? '—';
          const status = (row.status || 'offline').toLowerCase();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${i+1}</td>
            <td>${peer}</td>
            <td>${score}</td>
            <td>${reward}</td>
            <td class="status ${status}">${status}</td>
          `;
          tbody.appendChild(tr);
        });
        if(list.length === 0){
          tbody.innerHTML = `<tr><td class="center" colspan="5">No data</td></tr>`;
        }
      }catch(e){
        console.error(e);
        tbody.innerHTML = `<tr><td class="center" colspan="5">Error loading data</td></tr>`;
      }
    }

    async function lookupPeer(){
      const q = document.getElementById('peerIdInput').value.trim().toLowerCase();
      const out = document.getElementById('peerResult');
      if(!q){ out.textContent = 'Enter a peer ID first.'; return; }
      out.textContent = 'Searching…';
      try{
        const data = await getJSON(API.leaderboard);
        const list = Array.isArray(data) ? data : (data.leaderboard || []);
        const hit = list.find(p => (p.peer || p.name || p.node || '').toLowerCase().includes(q));
        if(!hit){ out.textContent = 'No peer found in current snapshot.'; return; }
        out.textContent = `Peer ${hit.peer || hit.name || hit.node} • Score ${hit.score ?? '—'} • Reward ${hit.reward ?? '—'} • Status ${hit.status ?? '—'}`;
      }catch(e){
        console.error(e);
        out.textContent = 'Error fetching peer info.';
      }
    }

    // Initial load + auto refresh every 30s
    function refreshAll(){ loadStats(); loadLeaderboard(); }
    refreshAll();
    setInterval(refreshAll, 30000);

    document.getElementById('lookupBtn').addEventListener('click', lookupPeer);
    document.getElementById('peerIdInput').addEventListener('keydown', e => { if(e.key==='Enter') lookupPeer(); });
  </script>
</body>
</html>
