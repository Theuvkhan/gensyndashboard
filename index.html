<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>⚡ Gensyn Node Dashboard</title>
  <style>
    :root { --bg:#0b1324; --card:#111b33; --muted:#8fa4c9; --ok:#00ffae; --err:#ff5a5a; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,Segoe UI,Arial}
    h1{font-size:2rem;text-align:center;margin:16px 8px}
    .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:16px 0}
    .stat{background:var(--card);padding:18px 24px;border-radius:14px;min-width:240px;text-align:center}
    .label{font-size:.95rem;color:var(--muted);margin-bottom:6px}
    .value{font-size:1.6rem;font-weight:700;color:var(--ok)}
    h2{width:100%;text-align:center;margin:24px 0 8px}
    table{width:92%;max-width:1100px;margin:0 auto;border-collapse:collapse;border-radius:12px;overflow:hidden}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #1b2a4a}
    th{background:#15233d;color:#d9e6ff}
    tr:nth-child(even){background:#0f1a30}
    .status.online{color:var(--ok)} .status.offline{color:var(--err)}
    .center{display:flex;justify-content:center;align-items:center}
    .peer-search{margin:26px 0}
    .peer-search input{padding:10px 12px;width:420px;max-width:75vw;border:none;border-radius:8px}
    .peer-search button{margin-left:8px;padding:10px 18px;border:none;border-radius:8px;background:var(--ok);color:#001b12;font-weight:700;cursor:pointer}
    .muted{color:var(--muted)} footer{margin:32px 0;text-align:center}
    a{color:var(--ok);text-decoration:none}
    .pager{display:flex;gap:10px;justify-content:center;align-items:center;margin:14px 0 26px}
    .pager button{padding:8px 14px;border:none;border-radius:8px;background:#1b2a4a;color:#d9e6ff;cursor:pointer}
    .pager button:disabled{opacity:.4;cursor:not-allowed}
    .pill{background:#15233d;border-radius:999px;padding:6px 12px;color:#cfe0ff}
  </style>
</head>
<body>
  <h1>⚡ Gensyn Node Dashboard</h1>

  <div class="stats">
    <div class="stat">
      <div class="label">Avg Block Time</div>
      <div id="avgBlockTime" class="value">--</div>
    </div>
    <div class="stat">
      <div class="label">Completed Transactions</div>
      <div id="completedTx" class="value">--</div>
    </div>
    <div class="stat">
      <div class="label">Nodes Connected</div>
      <div id="nodesConnected" class="value">--</div>
    </div>
  </div>

  <h2>🏆 Leaderboard (Top 100)</h2>
  <div class="pager">
    <button id="prevBtn">◀ Prev</button>
    <span class="pill"><span id="pageLabel">Page 1 / 10</span></span>
    <button id="nextBtn">Next ▶</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:60px">#</th>
        <th>Peer</th>
        <th style="width:160px">Score</th>
        <th style="width:160px">Reward</th>
        <th style="width:120px">Status</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody">
      <tr><td class="center" colspan="5">Loading…</td></tr>
    </tbody>
  </table>

  <div class="peer-search center">
    <div>
      <h3 class="center">🔎 Node Analytics (by Peer ID / Name)</h3>
      <div class="center">
        <input id="peerIdInput" placeholder="Enter Peer ID (e.g., Qm...) or name" />
        <button id="lookupBtn">Lookup</button>
      </div>
      <p id="peerResult" class="center muted"></p>
    </div>
  </div>

  <footer class="muted">
    Auto-updates every 30 s • Data from public Gensyn endpoints<br/>
    Made with ❤️ by @TheUvKhan
  </footer>

  <script>
    // Use our proxy. 'summary' gives normalized stats (avg block time, completed tx, nodes)
    const API = {
      summary:     '/api/gensyn?path=summary',
      leaderboard: '/api/gensyn?path=leaderboard'
    };

    const PAGE_SIZE = 10;
    const TOP_N = 100;
    let entries = [];
    let currentPage = 1;
    const totalPages = Math.ceil(TOP_N / PAGE_SIZE);

    function fmt(x){ return (x ?? '--').toLocaleString ? x.toLocaleString() : x; }

    async function getJSON(url){
      const r = await fetch(url, { cache: 'no-store' });
      if(!r.ok) throw new Error(url + ' → ' + r.status);
      return r.json();
    }

    // Stats via normalized summary
    async function loadStats(){
      try{
        const s = await getJSON(API.summary);
        document.getElementById('avgBlockTime').textContent =
          (s.avgBlockTimeSec != null) ? `${s.avgBlockTimeSec.toFixed(2)}s` : '--';
        document.getElementById('completedTx').textContent   = fmt(s.completedTx);
        document.getElementById('nodesConnected').textContent= fmt(s.nodesConnected);
      }catch(e){ console.error(e); }
    }

    async function loadLeaderboard(){
      const tbody = document.getElementById('leaderboardBody');
      try{
        const data = await getJSON(API.leaderboard);
        const all = (data.entries || []).sort((a,b)=>(b.score??0)-(a.score??0));
        entries = all.slice(0, TOP_N);
        currentPage = 1;
        renderPage();
      }catch(e){
        console.error(e);
        tbody.innerHTML = `<tr><td class="center" colspan="5">Error loading data</td></tr>`;
      }
    }

    function renderPage(){
      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      const start = (currentPage - 1) * PAGE_SIZE;
      const rows = entries.slice(start, start + PAGE_SIZE);

      rows.forEach((row,i)=>{
        const idx = start + i + 1;
        const peer   = row.peerName || row.peerId || '—';
        const score  = row.score ?? '—';
        const reward = row.reward ?? '—';
        const status = row.online ? 'online' : 'offline';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${idx}</td>
          <td>${peer}</td>
          <td>${score}</td>
          <td>${reward}</td>
          <td class="status ${status}">${status}</td>`;
        tbody.appendChild(tr);
      });

      if(rows.length===0){
        tbody.innerHTML = `<tr><td class="center" colspan="5">No data</td></tr>`;
      }
      document.getElementById('pageLabel').textContent = `Page ${currentPage} / ${totalPages}`;
      document.getElementById('prevBtn').disabled = currentPage<=1;
      document.getElementById('nextBtn').disabled = currentPage>=totalPages;
    }

    function prev(){ if(currentPage>1){ currentPage--; renderPage(); } }
    function next(){ if(currentPage<totalPages){ currentPage++; renderPage(); } }

    async function lookupPeer(){
      const q = (document.getElementById('peerIdInput').value||'').trim();
      const out = document.getElementById('peerResult');
      if(!q){ out.textContent='Enter a peer ID or name.'; return; }
      out.textContent='Searching…';

      try{
        const data = await getJSON(API.leaderboard);
        const all = Array.isArray(data.entries)?data.entries:[];
        let query = q;
        const idx = query.toLowerCase().lastIndexOf('/p2p/');
        if (idx !== -1) query = query.slice(idx+5);
        const qLower=query.replace(/\s+/g,'').toLowerCase();

        const exact = all.find(p=>(p.peerId||'').toLowerCase()===qLower);
        const matches = exact ? [exact] :
          all.filter(p=>{
            const pid=(p.peerId||'').toLowerCase();
            const name=(p.peerName||'').toLowerCase();
            return pid.includes(qLower) || name.includes(qLower) || qLower.includes(pid);
          }).slice(0,5);

        if(!matches.length){
          out.textContent='No peer matched that ID or name in the current snapshot.';
          return;
        }

        const lines = matches.map(p=>{
          const name=p.peerName||'—';
          const pid=p.peerId||'—';
          const score=p.score??'—';
          const reward=p.reward??'—';
          const status=p.online?'online':'offline';
          return `${name} (${pid}) • Score ${score} • Reward ${reward} • ${status}`;
        });
        out.innerHTML = lines.join('<br>');
      }catch(e){
        console.error(e);
        out.textContent='Error fetching peer info.';
      }
    }

    function refreshAll(){ loadStats(); loadLeaderboard(); }
    refreshAll();
    setInterval(refreshAll,30000);

    document.getElementById('prevBtn').addEventListener('click',prev);
    document.getElementById('nextBtn').addEventListener('click',next);
    document.getElementById('lookupBtn').addEventListener('click',lookupPeer);
    document.getElementById('peerIdInput').addEventListener('keydown',e=>{if(e.key==='Enter')lookupPeer();});
  </script>
</body>
</html>
